name: super_planner
description: "Super Planner - Collaborative shared calendar for groups, friends, and couples."
publish_to: 'none'

version: 1.1.2+19

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2
  flutter_riverpod: ^2.6.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/app_icon_fg.png
    - assets/app_icon_full.png

